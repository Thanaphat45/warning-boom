name: Update Thai holidays

# Refreshes holidays.json from Google's public Thai holiday calendar on the 1st of
# every month, so newly announced holidays (e.g. next year's Buddhist days or
# special cabinet holidays) appear in the app without editing code.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_holidays.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- holidays.json; then echo "No changes"; exit 0; fi
          git config user.name "holiday-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holidays.json
          git commit -m "Update Thai holidays"
          git push
